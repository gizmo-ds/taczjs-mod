plugins {
    id 'com.github.johnrengelman.shadow'
}

loom {
    accessWidenerPath = file("src/main/resources/taczjs.accesswidener")
    mixin{
        defaultRefmapName = "taczjs.refmap.json"
    }
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    modApi "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"

    modImplementation "curse.maven:tacz-refabricated-1334246:$rootProject.tacz_fabric_version"
    implementation(minecraftLibraries('org.apache.commons:commons-math3:3.6.1'))
    implementation('com.github.FiguraMC.luaj:luaj-core:3.0.8-figura') {
        exclude group: 'org.apache.commons', module: 'commons-lang3'
    }
    implementation('com.github.FiguraMC.luaj:luaj-jse:3.0.8-figura') {
        exclude group: 'org.apache.commons', module: 'commons-lang3'
    }
    implementation('org.apache.bcel:bcel:6.6.1') {
        exclude group: 'org.apache.commons', module: 'commons-lang3'
    }
    modRuntimeOnly "curse.maven:modern-keybinding-fabric-695433:4913784"
    modImplementation("dev.onyxstudios.cardinal-components-api:cardinal-components-base:5.2.3")
    modImplementation("dev.onyxstudios.cardinal-components-api:cardinal-components-entity:5.2.3")
    modApi "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:8.0.2"

    modImplementation "dev.latvian.mods:kubejs-fabric:${rootProject.kubejs_version}"

    modLocalRuntime 'curse.maven:playeranimator-658587:4587215'

    modLocalRuntime("mezz.jei:jei-$rootProject.minecraft_version-fabric:$rootProject.jei_version") { transitive = false }

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionForge')
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
}
